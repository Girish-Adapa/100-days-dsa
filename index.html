        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .date-info {
            color: #666;
            margin-top: 10px;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-size: 1em;
        }

        .filter-btn, .reset-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .reset-btn {
            background: #f44336;
            border-color: #f44336;
            color: white;
        }

        .reset-btn:hover {
            background: #d32f2f;
            border-color: #d32f2f;
        }

        .day-section {
            margin-bottom: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .day-section.current-day {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .day-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1em;
        }

        .day-header.revision {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
        }

        .day-header.current {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
        }

        .day-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .day-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .day-progress {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .collapse-icon {
            transition: transform 0.3s;
            font-size: 0.8em;
        }

        .day-section.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .problems-container {
            padding: 20px;
            background: #f9f9f9;
        }

        .problem-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .problem-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .problem-item.completed {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .problem-info {
            flex: 1;
        }

        .problem-number {
            font-size: 0.75em;
            color: #999;
            margin-bottom: 3px;
        }

        .problem-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .problem-meta {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .problem-difficulty {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
        }

        .easy {
            background: #d4edda;
            color: #155724;
        }

        .medium {
            background: #fff3cd;
            color: #856404;
        }

        .hard {
            background: #f8d7da;
            color: #721c24;
        }

        .problem-topic {
            font-size: 0.8em;
            color: #666;
            background: #f0f0f0;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .problem-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .check-button {
            width: 30px;
            height: 30px;
            border: 3px solid #667eea;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 1.2em;
        }

        .problem-item.completed .check-button {
            background: #4caf50;
            border-color: #4caf50;
            color: white;
        }

        .leetcode-link {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .leetcode-link:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        .notes-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }

        .notes-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.9em;
            resize: vertical;
            min-height: 60px;
        }
        
                  .footer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: 20px;
        }

            color: white;
            text-decoration: none;
            font-weight: 600;
        }

            text-decoration: underline;
        }

            .problem-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .problem-actions {
                width: 100%;
                justify-content: space-between;
                margin-top: 10px;
            }
        }

        @media print {
            body {
                background: white;
            }
            .controls, .reset-btn {
                display: none;
            }
        }

        let completedProblems = new Set();
        let problemNotes = {};
        let currentFilter = 'all';

        function loadProgress() {
            const saved = localStorage.getItem('neetcode150Progress');
            if (saved) {
                const data = JSON.parse(saved);
                completedProblems = new Set(data.completed || []);
                problemNotes = data.notes || {};
            }
        }

        function saveProgress() {
            const data = {
                completed: Array.from(completedProblems),
                notes: problemNotes
            };
            localStorage.setItem('neetcode150Progress', JSON.stringify(data));
        }

        function resetProgress() {
            if (confirm('⚠️ Are you sure you want to reset ALL progress? This cannot be undone!')) {
                completedProblems.clear();
                problemNotes = {};
                saveProgress();
                renderDays();
                updateStats();
            }
        }

        function toggleProblem(problemId) {
            if (completedProblems.has(problemId)) {
                completedProblems.delete(problemId);
            } else {
                completedProblems.add(problemId);
            }
            saveProgress();
            renderDays();
            updateStats();
        }

        function getCurrentDay() {
            const today = new Date();
            const daysPassed = Math.floor((today - START_DATE) / (1000 * 60 * 60 * 24));
            return daysPassed + 1;
        }

        function updateStats() {
            const totalProblems = dailyPlan.reduce((sum, day) => sum + day.problems.length, 0);
            const completed = completedProblems.size;
            const remaining = totalProblems - completed;
            const percentage = totalProblems > 0 ? Math.round((completed / totalProblems) * 100) : 0;
            
            document.getElementById('totalCompleted').textContent = completed;
            document.getElementById('totalRemaining').textContent = remaining;
            document.getElementById('percentComplete').textContent = percentage + '%';
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressFill').textContent = percentage + '%';
            
            const currentDay = getCurrentDay();
            document.getElementById('currentDayNum').textContent = currentDay > 150 ? 'Completed!' : `Day ${currentDay}`;
            
            const today = new Date();
            document.getElementById('currentDate').textContent = today.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function renderDays() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            const currentDay = getCurrentDay();
            let globalProblemNumber = 0;

            dailyPlan.forEach(day => {
                const dayCompleted = day.problems.every(p => 
                    completedProblems.has(`day${day.day}-${p.title}`)
                );
                
                const dayStarted = day.problems.some(p => 
                    completedProblems.has(`day${day.day}-${p.title}`)
                );

                // Apply filters
                if (currentFilter === 'completed' && !dayCompleted && day.problems.length > 0) return;
                if (currentFilter === 'pending' && (dayCompleted || day.problems.length === 0)) return;
                if (currentFilter === 'today' && day.day !== currentDay) return;

                const daySection = document.createElement('div');
                daySection.className = `day-section ${day.day === currentDay ? 'current-day' : ''} ${day.isRevision ? 'revision-day' : ''}`;
                
                const isCurrentDay = day.day === currentDay;
                const headerClass = day.isRevision ? 'revision' : (isCurrentDay ? 'current' : '');
                
                const completedCount = day.problems.filter(p => 
                    completedProblems.has(`day${day.day}-${p.title}`)
                ).length;

                daySection.innerHTML = `
                    <div class="day-header ${headerClass}" onclick="toggleDay(this)">
                        <div class="day-info">
                            <span style="font-size: 1.2em;">Day ${day.day}</span>
                            <span class="day-badge">${day.date}</span>
                            <span class="day-badge">${day.topic}</span>
                            ${isCurrentDay ? '<span class="day-badge" style="background: rgba(255,255,255,0.4);">📍 TODAY</span>' : ''}
                        </div>
                        <div class="day-info">
                            ${day.problems.length > 0 ? `<span class="day-progress">${completedCount}/${day.problems.length} completed</span>` : ''}
                            <span class="collapse-icon">▼</span>
                        </div>
                    </div>
                    <div class="problems-container" id="day${day.day}">
                    </div>
                `;

                const problemsContainer = daySection.querySelector('.problems-container');

                day.problems.forEach(problem => {
                    globalProblemNumber++;
                    const problemId = `day${day.day}-${problem.title}`;
                    const isCompleted = completedProblems.has(problemId);

                    const problemDiv = document.createElement('div');
                    problemDiv.className = `problem-item ${isCompleted ? 'completed' : ''}`;
                    problemDiv.innerHTML = `
                        <div class="problem-info">
                            <div class="problem-number">Problem #${globalProblemNumber}</div>
                            <div class="problem-title">${problem.title}</div>
                            <div class="problem-meta">
                                <span class="problem-difficulty ${problem.difficulty}">${problem.difficulty.toUpperCase()}</span>
                                <span class="problem-topic">${day.topic}</span>
                            </div>
                        </div>
                        <div class="problem-actions">
                            <div class="check-button" onclick="toggleProblem('${problemId}')">
                                ${isCompleted ? '✓' : ''}
                            </div>
                            <a href="${problem.link}" target="_blank" class="leetcode-link" onclick="event.stopPropagation()">
                                LeetCode →
                            </a>
                        </div>
                    `;

                    problemsContainer.appendChild(problemDiv);
                });

                container.appendChild(daySection);
            });

            updateStats();
        }

        function toggleDay(header) {
            const section = header.parentElement;
            const container = header.nextElementSibling;
            container.classList.toggle('hidden');
            section.classList.toggle('collapsed');
        }

        function filterDays(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderDays();
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            document.querySelectorAll('.problem-item').forEach(item => {
                const title = item.querySelector('.problem-title').textContent.toLowerCase();
                const number = item.querySelector('.problem-number').textContent.toLowerCase();
                if (title.includes(searchTerm) || number.includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });

            // Show/hide day sections based on visible problems
            document.querySelectorAll('.day-section').forEach(section => {
                const visibleProblems = section.querySelectorAll('.problem-item:not([style*="display: none"])');
                if (visibleProblems.length > 0 || searchTerm === '') {
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + K to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchBox').focus();
            }
        });

        // Auto-scroll to current day on load
        function scrollToCurrentDay() {
            setTimeout(() => {
                const currentDayElement = document.querySelector('.day-section.current-day');
                if (currentDayElement) {
                    currentDayElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 500);
        }

        // Initialize
        loadProgress();
        renderDays();
        scrollToCurrentDay();

        // Auto-save every 30 seconds
        setInterval(saveProgress, 30000);

        // Export progress function
        function exportProgress() {
            const data = {
                completed: Array.from(completedProblems),
                notes: problemNotes,
                exportDate: new Date().toISOString(),
                totalCompleted: completedProblems.size
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `neetcode-progress-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        // Add export button functionality
        console.log('📊 Tip: Open console and type "exportProgress()" to download your progress as JSON');
    </script>
